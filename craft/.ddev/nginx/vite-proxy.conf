# Proxy Vite dev server on 127.0.0.1:5173 through DDEV nginx (HTTPS in the browser).
# Requires Vite running in the web container (see web_extra_daemons) or `ddev exec npm run dev`.
# Twig: set vite_DEV_SERVER_URL= (empty) in .env so script URLs are same-origin.

location ^~ /@vite/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

